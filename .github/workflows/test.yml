name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux zsh jq sqlite3 shellcheck
      - run: shellcheck -x -S warning install.sh tmux-restore.tmux scripts/*.sh agents/*.sh tests/*.sh
      - run: tests/hook-unit.sh
      - run: tests/agents-unit.sh
      - run: tests/shutdown-unit.sh

  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Plugins
        run: |
          mkdir -p ~/.tmux/plugins && cd ~/.tmux/plugins
          git clone -q --depth 1 https://github.com/tmux-plugins/tpm
          git clone -q --depth 1 -b fix-concurrent-restore https://github.com/andrewboldi/tmux-resurrect
          git clone -q --depth 1 https://github.com/tmux-plugins/tmux-continuum
      - run: tests/restore-race.sh double
      - run: tests/restore-race.sh single
      - run: tests/login-replay.sh
      - run: tests/restore-lock-release.sh bg-hook
      - run: tests/restore-safety-net.sh

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:12, fedora:41, archlinux:latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the test bundles the checkout, which a shallow clone can't do
      - run: tests/install-containers.sh ${{ matrix.image }}
