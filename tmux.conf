# --- tmux-restore (https://github.com/andrewboldi/tmux-restore) ---
# Paste into ~/.tmux.conf ABOVE the `run '~/.tmux/plugins/tpm/tpm'` line, then press prefix + I.
# Saved every minute and right before shutdown/reboot (tmux-shutdown-save.service), restored
# automatically when the tmux server starts. Manual: prefix C-s saves, prefix C-r restores.
set -g @plugin 'tmux-plugins/tpm'
# tmux-resurrect plus a fix for concurrent restores, until it is merged upstream
set -g @plugin 'andrewboldi/tmux-resurrect#fix-concurrent-restore'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-command-strategy 'linux_procfs'
# Re-run on restore, on top of resurrect's defaults (vi vim view nvim emacs man less more tail top
# htop irssi weechat mutt). The hook turns claude into "claude --resume <id> ..." and anything not
# listed here into a pre-typed prompt ("print ..."); see scripts/resurrect-post-save.sh
set -g @resurrect-processes 'btop nvtop watch ssh mosh print "~claude --resume " "~claude --session-id "'
set -g @resurrect-hook-post-save-layout '~/.tmux/tmux-restore/scripts/resurrect-post-save.sh'
